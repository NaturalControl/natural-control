name: POC tests

# Lint and test the Python code on every pull request and push to main that changes it.
# Nothing is deployed and no keys are needed.
on:
  push:
    branches: [main]
    paths: ["src/**", ".github/workflows/poc.yml"]
  pull_request:
    branches: [main]
    paths: ["src/**", ".github/workflows/poc.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests
        run: uv run pytest
